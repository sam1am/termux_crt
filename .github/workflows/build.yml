name: Build & Release Debug APK

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          OLD_CODE=$(grep -oE 'versionCode [0-9]+' app/build.gradle | head -1 | awk '{print $2}')
          NEW_CODE=$((OLD_CODE + 1))
          NEW_NAME="0.${NEW_CODE}.0"
          sed -i -E "s/versionCode ${OLD_CODE}/versionCode ${NEW_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${NEW_NAME}\"/" app/build.gradle
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_NAME}"   >> "$GITHUB_OUTPUT"
          echo "Bumped to versionCode=${NEW_CODE}, versionName=${NEW_NAME}"
          grep -E "versionCode |versionName " app/build.gradle | head -2

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/debug/termux-crt-${{ steps.bump.outputs.name }}-debug.apk"
          cp "$SRC" "$DEST"
          echo "DEST=$DEST"

      - name: Commit version bump and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/termux-crt-${{ steps.bump.outputs.name }}-debug.apk
